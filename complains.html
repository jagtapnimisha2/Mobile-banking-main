                            <script>

                                let currentSlide = 0;

                                function showSlide(index) {
                                    const slides = document.querySelector('.slides');
                                    const totalSlides = document.querySelectorAll('.card').length;
                                    const cardsToShow = 3;
                                    const totalVisibleCards = totalSlides - cardsToShow + 1;

                                    if (index >= totalVisibleCards) {
                                        currentSlide = 0;
                                    } else if (index < 0) {
                                        currentSlide = totalVisibleCards - 1;
                                    } else {
                                        currentSlide = index;
                                    }

                                    const offset = -currentSlide * (300 + 20); // 300px width + 20px margin
                                    slides.style.transform = `translateX(${offset}px)`;
                                }

                                function nextSlide() {
                                    showSlide(currentSlide + 1);
                                }

                                function prevSlide() {
                                    showSlide(currentSlide - 1);
                                }

                                // Auto slide every 3 seconds
                                setInterval(() => {
                                    nextSlide();
                                }, 3000);

                                // Initially show the first slide
                                showSlide(currentSlide);
                            </script>

                            <script>
                                function openNav() {

                                function closeNav() {

                                    document.querySelector(".content").style.marginLeft = "0";
                                    const logo = document.getElementById('logo');
                                    logo.style.visibility = 'visible';
                                }
                            </script>
                            <script>
                                function createSlider(sliderId) {
                                    let slideIndex = 0;
                                    const slider = document.getElementById(sliderId);
                                    const slides = slider.querySelectorAll('.slide');
                                    const totalSlides = slides.length;

                                    function showNextSlide() {
                                        slides[slideIndex].classList.remove('active');
                                        slideIndex = (slideIndex + 1) % totalSlides;
                                        slides[slideIndex].classList.add('active');
                                        slider.querySelector('.slides').style.transform = `translateX(${-slideIndex * 100}%)`;
                                    }

                                    setInterval(showNextSlide, 3000);
                                }

                                createSlider('slider1');
                                createSlider('slider2');

                            </script>
                            <script>
                                // scripts.js

                                // Ensure the sidebar takes up the full height of the viewport
                                function adjustsidebarHeight() {

                                }
